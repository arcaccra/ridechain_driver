name: ridechain_driiver
description: "A flutter application that enables drivers in the blockchain to use their cars as rides."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.2+6


environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cached_network_image:
  country_picker:
  cupertino_icons: ^1.0.8
  dio:
  dotenv: ^4.2.0
  dots_indicator:
  flutter_animate:
  flutter_dotenv:
  flutter_local_notifications:
  flutter_multi_formatter:
  flutter_screenutil:
  flutter_svg:
  get:
  gap:
  get_it:
  geolocator: ^14.0.0
  google_maps_flutter:
  google_fonts:
  image_picker:
  intl:
  maps_launcher:
  path:
  path_provider:
  pin_code_fields:
  provider:
  shared_preferences:
  connectivity_plus: ^7.0.0
  url_launcher:
  dotted_line_flutter: ^2.1.8
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  image: ^4.5.4
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.2.0
  dotted_border: ^3.1.0
  http: ^1.5.0
  permission_handler: ^12.0.1
  workmanager: ^0.9.0+2
  map_launcher: ^4.0.0
  flutter_rating: ^2.0.2
  file_picker: ^10.3.3
  cloud_firestore: ^6.1.0
  firebase_messaging: ^16.0.0
  googleapis_auth: ^2.0.0
  uuid: ^4.5.2
  mobile_scanner: ^7.1.3
  rename: ^3.1.0
  flutter_launcher_icons: ^0.14.4

  # Cardano blockchain integration
  cardano_flutter_sdk: ^3.2.0
  cardano_dart_types: ^2.12.1
  catalyst_cardano_serialization: ^1.0.0
  flutter_secure_storage: ^10.3.1
  cbor: ^6.3.2




dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


# The following section is specific to Flutter packages.
flutter:


  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - secrets/ridechain-key.json
    - assets/svgs/
    - assets/images/

  fonts:
    - family: BeauSans
      fonts:
        - asset: fonts/BT-BeauSans.ttf
          weight: 400
        - asset: fonts/BT-BeauSans-Medium.ttf
          weight: 500
        - asset: fonts/BT-BeauSans-Bold.ttf
          weight: 700
        - asset: fonts/BT-BeauSans-ExtraBold.ttf
          weight: 800
    - family: Zain
      fonts:
        - asset: fonts/Zain.ttf
    - family: Outfit
      fonts:
        - asset: fonts/Outfit-Regular.ttf
          weight: 400
        - asset: fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: fonts/Outfit-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: fonts/Inter-Thin.otf
          weight: 300
        - asset: fonts/Inter-Medium.otf
          weight: 500
        - asset: fonts/Inter-Regular.otf
          weight: 400


